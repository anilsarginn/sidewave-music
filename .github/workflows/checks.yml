name: Checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            sidewave/package-lock.json
            sidewave/web/package-lock.json
      - run: npm ci && npm test && node scripts/generate-models.mjs --check
        working-directory: sidewave
      - run: npm ci && npm test && npm run build
        working-directory: sidewave/web
      - run: npx playwright install --with-deps chromium
        working-directory: sidewave/web
      - run: npm run test:e2e -- --workers=1
        working-directory: sidewave/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: sidewave/web/test-results/
          retention-days: 3
  resolver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ytres/requirements*.txt
      - run: pip install -r requirements-dev.txt && python -m pytest -q
        working-directory: ytres
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
        working-directory: sidewave/android
      - uses: actions/upload-artifact@v4
        with:
          name: sidewave-debug-apk
          path: sidewave/android/app/build/outputs/apk/debug/app-debug.apk
